<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For You</title>
    <style>
      :root {
        --bg1: #3a0f2e;
        --bg2: #8a2a63;
        --glass: rgba(255, 255, 255, 0.14);
        --line: rgba(255, 255, 255, 0.3);
        --text: #fff;
        --soft: #ffd9e8;
        --accent: #ff4d73;
        --accent2: #ff7a59;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }
      .card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 380px;
        max-height: 92vh;
        overflow: hidden;
        padding: 30px 24px;
        text-align: center;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 24px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .step {
        display: none;
      }
      .step.on {
        display: block;
        animation: in 0.6s ease;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      h1,
      h2 {
        font-size: 1.7rem;
        line-height: 1.25;
        margin-bottom: 14px;
      }
      p {
        font-size: 1rem;
        line-height: 1.65;
        color: var(--soft);
        margin-bottom: 20px;
      }
      .heart {
        font-size: 2.6rem;
        display: block;
        margin-bottom: 10px;
        animation: beat 1.3s infinite;
      }
      @keyframes beat {
        50% {
          transform: scale(1.18);
        }
      }
      button {
        font: inherit;
        font-weight: bold;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 13px 26px;
        cursor: pointer;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        box-shadow: 0 8px 22px rgba(255, 77, 115, 0.45);
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .reason {
        text-align: left;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .reason b {
        display: block;
        margin-bottom: 4px;
      }
      .reason span {
        font-size: 0.92rem;
        color: var(--soft);
        line-height: 1.5;
      }
      .photo {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 16px;
        background: #fff2 center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .quote {
        font-style: italic;
        margin-bottom: 10px;
        color: #fff;
      }
      .glow {
        font-size: 1.8rem;
        font-weight: bold;
        line-height: 1.3;
        color: #ff9bb5;
        text-shadow:
          0 0 12px var(--accent),
          0 0 28px var(--accent);
      }
      .fl {
        position: fixed;
        bottom: -40px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
      }
      @keyframes up {
        to {
          transform: translateY(-115vh) rotate(40deg);
          opacity: 0;
        }
      }
      canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .fl,
        .heart {
          animation: none;
        }
        .step.on {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <section class="step on">
        <span class="heart">❤️</span>
        <h1 id="hello"></h1>
        <p id="intro"></p>
        <button data-next>Open my message</button>
      </section>

      <section class="step">
        <h2>Countless reasons why I adore you</h2>
        <div id="reasons"></div>
        <button data-next>Continue</button>
      </section>

      <section class="step">
        <h2>A snapshot of our story</h2>
        <div class="photo" id="photo"></div>
        <p class="quote" id="caption"></p>
        <button data-next>One final thought</button>
      </section>

      <section class="step">
        <span class="heart">💖</span>
        <h2>My Deepest wish for you</h2>
        <p id="wish"></p>
        <div class="glow" id="bday"></div>
      </section>
    </div>
    <canvas id="c"></canvas>

    <script>
      /* ===== EDIT THIS PART ===== */
      const CONFIG = {
        hello: "Hello, My Love.",
        intro:
          "Every beat of my heart whispers your name. On this special day, I wanted to create a small piece of magic just for you.",
        reasons: [
          [
            "💖 Your infectious laughter",
            "It's the most beautiful sound, a melody that brightens even the darkest days.",
          ],
          [
            "✨ Your brilliant mind",
            "The way you think and care inspires me every single day.",
          ],
          [
            "🌸 Your gentle soul",
            "Your kindness makes everyone around you feel at home.",
          ],
        ],
        photo: "dech2.jpg", // put your picture next to this file; if missing, a heart shows
        caption: "“Loves” — your favorite chapter.",
        wish: "Chapter 18 begins! 🦋✨ Happy Birthday, girl! Stay blessed, stay gorgeous, and keep glowing! ❤️",
        birthday: "Happy Birthday,Dear! ❤️",
      };
      /* ========================== */

      const $ = (id) => document.getElementById(id);
      $("hello").textContent = CONFIG.hello;
      $("intro").textContent = CONFIG.intro;
      $("caption").textContent = CONFIG.caption;
      $("wish").textContent = CONFIG.wish;
      $("bday").textContent = CONFIG.birthday;
      CONFIG.reasons.forEach(([t, d]) => {
        const el = document.createElement("div");
        el.className = "reason";
        el.innerHTML = "<b></b><span></span>";
        el.children[0].textContent = t;
        el.children[1].textContent = d;
        $("reasons").appendChild(el);
      });
      const img = new Image();
      img.alt = "Our photo";
      img.onload = () => {
        $("photo").textContent = "";
        $("photo").appendChild(img);
      };
      img.onerror = () => {
        $("photo").textContent = "💞";
      };
      $("photo").textContent = "💞";
      img.src = CONFIG.photo;

      /* steps */
      const steps = [...document.querySelectorAll(".step")];
      let i = 0;
      document.querySelectorAll("[data-next]").forEach((b) =>
        b.addEventListener("click", () => {
          steps[i].classList.remove("on");
          i++;
          steps[i].classList.add("on");
          document.querySelector(".card").scrollTop = 0;
          if (i === steps.length - 1) confetti();
        }),
      );

      
      /* confetti */
      function confetti() {
        if (reduce) return;
        const c = $("c"),
          x = c.getContext("2d");
        c.width = innerWidth;
        c.height = innerHeight;
        const cols = [
          "#ff4d73",
          "#ffd166",
          "#06d6a0",
          "#4cc9f0",
          "#c77dff",
          "#fff",
        ];
        const p = Array.from({ length: 140 }, () => ({
          x: Math.random() * c.width,
          y: -20 - Math.random() * c.height * 0.5,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          vy: 2 + Math.random() * 3.5,
          vx: -1.5 + Math.random() * 3,
          r: Math.random() * 6,
          vr: -0.15 + Math.random() * 0.3,
          c: cols[(Math.random() * cols.length) | 0],
        }));
        let t = 0;
        (function tick() {
          x.clearRect(0, 0, c.width, c.height);
          p.forEach((a) => {
            a.x += a.vx;
            a.y += a.vy;
            a.r += a.vr;
            x.save();
            x.translate(a.x, a.y);
            x.rotate(a.r);
            x.fillStyle = a.c;
            x.fillRect(-a.w / 2, -a.h / 2, a.w, a.h);
            x.restore();
          });
          if (++t < 300) requestAnimationFrame(tick);
          else x.clearRect(0, 0, c.width, c.height);
        })();
      }
    </script>

    <!-- ===== ADDED: date lock + background song ===== -->
    <style>
      #lock {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        background: radial-gradient(circle at 30% 20%, #8a2a63, #3a0f2e);
        color: #fff;
        font-family: Georgia, "Times New Roman", serif;
      }
      #lock.on {
        display: flex;
      }
      #lock .box {
        max-width: 340px;
        padding: 30px 24px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      #lock h2 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }
      #lock p {
        color: #ffd9e8;
        line-height: 1.6;
        margin-bottom: 14px;
      }
      #count {
        font-size: 1.6rem;
        font-weight: bold;
        color: #ff9bb5;
        text-shadow: 0 0 12px #ff4d73;
      }
      #mute {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 5;
        width: 42px;
        height: 42px;
        padding: 0;
        font-size: 1.2rem;
        display: none;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: none;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
    </style>
    <div id="lock">
      <div class="box">
        <span class="heart">🎁</span>
        <h2 id="lockTitle"></h2>
        <p id="lockMsg"></p>
        <div id="count"></div>
      </div>
    </div>
    <button id="mute" aria-label="Mute or unmute music">🔊</button>
    <script>
      /* ===== EDIT THIS PART ===== */
      const EXTRA = {
        unlockAt: "2026-11-09T00:08:00", // her birthday, your phone's local time (YYYY-MM-DDTHH:MM:SS)
        lockTitle: "Not yet, my love…",
        lockMsg:
          "Your surprise is waiting. Come back on your birthday and it will open.",
        song: "kesariya.mp3", // put your song next to this file; leave "" for no music
      };
      /* ========================== */

      (function () {
        const $ = (id) => document.getElementById(id);
        const card = document.querySelector(".card");
        $("lockTitle").textContent = EXTRA.lockTitle;
        $("lockMsg").textContent = EXTRA.lockMsg;

        /* date lock (add ?preview to the link to skip it while testing) */
        const target = new Date(EXTRA.unlockAt).getTime();
        const preview = location.search.includes("preview");
        function check() {
          const left = target - Date.now();
          if (preview || left <= 0) {
            $("lock").classList.remove("on");
            card.style.visibility = "visible";
            clearInterval(timer);
            return;
          }
          $("lock").classList.add("on");
          card.style.visibility = "hidden";
          const s = Math.floor(left / 1000),
            d = Math.floor(s / 86400),
            h = Math.floor((s % 86400) / 3600),
            m = Math.floor((s % 3600) / 60),
            x = s % 60;
          $("count").textContent =
            (d ? d + "d " : "") + h + "h " + m + "m " + x + "s";
        }
        const timer = setInterval(check, 1000);
        check();

        /* background song: starts on her first tap (phones block autoplay) */
        if (!EXTRA.song) return;
        const audio = new Audio(EXTRA.song);
        audio.loop = true;
        audio.volume = 0.7;
        let started = false;
        document.querySelectorAll("[data-next]").forEach((b) =>
          b.addEventListener("click", () => {
            if (started) return;
            started = true;
            audio
              .play()
              .then(() => {
                $("mute").style.display = "block";
              })
              .catch(() => {});
          }),
        );
        $("mute").addEventListener("click", () => {
          audio.muted = !audio.muted;
          $("mute").textContent = audio.muted ? "🔇" : "🔊"
        });
      })();
      document.querySelector("[data-next]").addEventListener("click", () => {
  document.getElementById("mute").style.display = "block";
});

    </script>

<script>

<!-- ===== ADDED: fix for confetti + page-turning photo book ===== -->
<script>
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
</script>
<style>
#photo,#caption{display:none !important}
#book{position:relative;width:100%;height:min(360px,46vh);margin-bottom:10px;perspective:1200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 10px 0;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.4);transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.4,.1,.2,1),opacity .8s}
.pg .im{flex:1;min-height:0;border-radius:8px;background:#ffe3ee;display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden}
.pg .im img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pg .tg{padding:10px 4px 12px;text-align:center;font-style:italic;font-size:.98rem;line-height:1.4;color:#7a1f4d}
.pg.turned{transform:rotateY(-160deg);opacity:0;pointer-events:none}
.pg.later{opacity:0}
#bookInfo{font-size:.85rem;color:#ffd9e8;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){.pg{transition:none}}
</style>
<script>
/* ===== EDIT THIS PART: one entry per page ===== */
const BOOK = [
  { src: "dec1.jpeg",  tag: "Where your story began ✨" },
  { src: "dec2.jpg",  tag: "Your smile lights up every room 😊" },
  { src: "dec3.jpg",  tag: "Pretty on the outside, kinder on the inside 🌸" },
  { src: "dec4.jpg",  tag: "Some people just make life brighter ☀️" },
  { src: "dec5.jpg",  tag: "Laughing with you is my favorite thing 😂" },
  { src: "dec6.jpg",  tag: "Stay gorgeous, stay glowing 💫" },
  { src: "dec7.jpg",  tag: "Chapter 18 begins today 🦋" },
  { src: "dec8.jpg",  tag: "Every memory with you is a keeper 📸" },
  { src: "dec9.jpg",  tag: "You make ordinary days feel special 💕" },
  { src: "dec10.jpg", tag: "Dream big, you’ve got this 🌟" },
  { src: "dec11.jpg", tag: "Here’s to new adventures ahead 🚀" },
  { src: "dec12.jpg", tag: "You deserve all the happiness in the world 🎁" },
  { src: "dec13.jpg", tag: "Friends like you are rare and precious 💎" },
  { src: "dec14.jpg", tag: "Never lose that sparkle in your eyes ✨" },
  { src: "dec15.jpg", tag: "Eighteen looks amazing on you 🎂" },
  { src: "dec16.jpg", tag: "May every wish you make come true 🌠" },
  { src: "dec17.jpg", tag: "The best is still ahead of you 🌈" },
  { src: "dec18.jpg", tag: "Happy 18th, may this year be your best one yet ❤️" }
];
/* ============================================== */

(function(){
  const step = document.querySelectorAll(".step")[2];
  const book = document.createElement("div");
  book.id = "book";
  const info = document.createElement("p");
  info.id = "bookInfo";
  step.insertBefore(book, step.querySelector("[data-next]"));
  step.insertBefore(info, step.querySelector("[data-next]"));

  const pages = BOOK.map(b => {
    const pg = document.createElement("div");
    pg.className = "pg";
    const im = document.createElement("div");
    im.className = "im";
    im.textContent = "💞";
    const img = new Image();
    img.alt = "";
    img.onload = () => { im.textContent = ""; im.appendChild(img); };
    img.src = b.src;
    const tg = document.createElement("div");
    tg.className = "tg";
    tg.textContent = b.tag;
    pg.append(im, tg);
    book.appendChild(pg);
    return pg;
  });

  let cur = 0;
  function render(){
    pages.forEach((pg, i) => {
      pg.style.zIndex = pages.length - i;
      pg.classList.toggle("turned", i < cur);
      pg.classList.toggle("later", i > cur + 1);
    });
    info.textContent = (cur + 1) + " / " + pages.length + "  ·  tap or swipe to turn the page";
  }
  const next = () => { if (cur < pages.length - 1) { cur++; render(); } };
  const prev = () => { if (cur > 0) { cur--; render(); } };
  render();

  let sx = 0;
  book.addEventListener("pointerdown", e => { sx = e.clientX; });
  book.addEventListener("pointerup", e => {
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); return; }
    const r = book.getBoundingClientRect();
    (e.clientX - r.left > r.width / 2) ? next() : prev();
  });
})();
</script>

<!-- ===== ADDED: unlock "One final thought" after the book is finished ===== -->
<style>
.step button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:grayscale(.3)}
.step button.ready{animation:readyPulse 1.2s ease 3}
@keyframes readyPulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.step button.ready{animation:none}}
</style>
<script>
/* ===== EDIT THIS PART ===== */
const REQUIRE_LAST_PAGE = true;   // true = unlock on the last page, false = unlock after the first page turn
const LOCKED_TEXT = "Turn the pages first 💕";
/* ========================== */

(function(){
  const btn = document.querySelectorAll(".step")[2].querySelector("[data-next]");
  const info = document.getElementById("bookInfo");
  if (!btn || !info) return;

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = LOCKED_TEXT;

  function unlock(){
    btn.disabled = false;
    btn.textContent = original;
    btn.classList.add("ready");
    obs.disconnect();
  }
  function check(){
    const m = info.textContent.match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return;
    const cur = +m[1], total = +m[2];
    if (REQUIRE_LAST_PAGE ? cur >= total : cur > 1) unlock();
  }
  const obs = new MutationObserver(check);
  obs.observe(info, { childList: true, characterData: true, subtree: true });
  check();   // handles a book with only one page
})();
</script>
